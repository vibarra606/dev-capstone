networks:
  isolated_lab_net:
    driver: bridge

services:
  attack-box:
    build: ./attack-environment
    container_name: attack-container
    networks:
      - isolated_lab_net
    ports:
      - "8080:80" # Our fake website will be inside this internal network

  defense-box:
    image: wazuh/wazuh-manager:4.9.0 # This is for the  SIEM tasks we have later on the defense side of the project
    container_name: defense-container
    networks:
      - isolated_lab_net
    ports:
      - "1514:1514" # Live feed of Windows VM sending security logs so we know our defense worked
    volumes:
      - ./defense-environment/wazuh-rules.xml:/var/ossec/etc/rules/local_rules.xml
